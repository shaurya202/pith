# Builds double-click Pith downloads on the OS that will run them.
# PyInstaller cannot cross-compile, and ctranslate2 / onnxruntime ship
# native wheels, so each job runs on a native runner.
#
# On GitHub, a v* tag also attaches the zip and dmg files to a Release.
# On Origin, Depot can run this same file from .depot/workflows/.
# Artifacts are the download either way. The app stays unsigned.

name: Build apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Pith-Windows-x64
          - os: macos-latest
            artifact: Pith-macOS-arm64
          - os: macos-15-intel
            artifact: Pith-macOS-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pith and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Build
        run: python scripts/package.py

      - name: Launch the packaged app
        run: python scripts/smoke_frozen.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/Pith-*.zip
            dist/Pith-*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the downloads
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
